name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate archive and metadata with Apple, but do not upload)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode and SDK information
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Run unit tests before archiving
        shell: bash
        run: |
          set -euo pipefail
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "import json, sys; d=json.load(sys.stdin)['devices']; print([dev['name'] for devs in d.values() for dev in devs if 'iPhone' in dev['name']][0])")
          echo "Running pre-flight test suite on simulator: $SIM_NAME"
          xcodebuild test \
            -project ClipHarbor.xcodeproj \
            -scheme ClipHarbor \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Setup signing keychain and provisioning profile
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD_INPUT: ${{ secrets.KEYCHAIN_PASSWORD }}
          INPUT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::error::Secret BUILD_CERTIFICATE_BASE64 is empty or missing."
            exit 1
          fi
          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::error::Secret BUILD_PROVISION_PROFILE_BASE64 is empty or missing."
            exit 1
          fi

          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD_INPUT:-$(uuidgen)}"
          KEYCHAIN_PATH="$RUNNER_TEMP/build_signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PP_PATH="$RUNNER_TEMP/embedded.mobileprovision"
          PROV_PLIST="$RUNNER_TEMP/provisioning_profile.plist"
          P12_PASS_FILE="$RUNNER_TEMP/.p12_pass"
          KC_PASS_FILE="$RUNNER_TEMP/.kc_pass"

          # Export KEYCHAIN_PATH immediately so cleanup step knows it even if setup fails midway
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          # Guarantee password file removal immediately on step exit or mid-step failure
          cleanup_passwords() {
            rm -f "$P12_PASS_FILE" "$KC_PASS_FILE" 2>/dev/null || true
          }
          trap cleanup_passwords EXIT

          # Decode certificate and provisioning profile safely into RUNNER_TEMP
          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode > "$CERT_PATH"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > "$PP_PATH"

          # Write passwords to restricted temporary files with 0600 permissions
          printf "%s" "$P12_PASSWORD" > "$P12_PASS_FILE"
          chmod 600 "$P12_PASS_FILE"
          printf "%s" "$KEYCHAIN_PASSWORD" > "$KC_PASS_FILE"
          chmod 600 "$KC_PASS_FILE"

          # Create temporary keychain
          security create-keychain -p "$(cat "$KC_PASS_FILE")" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$(cat "$KC_PASS_FILE")" "$KEYCHAIN_PATH"

          # Import p12 certificate (OpenSSL 1.1 / OpenSSL 3.x dual compatibility handling)
          # Note: macOS `security import` requires password via -P argument; OpenSSL uses env:P12_PASSWORD directly
          if security import "$CERT_PATH" -P "$(cat "$P12_PASS_FILE")" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" 2>/dev/null; then
            echo "Apple Distribution certificate imported successfully (standard format)."
          else
            echo "Direct security import failed. Converting OpenSSL 3.x PKCS#12 to OpenSSL 1.1 legacy format..."
            openssl pkcs12 -in "$CERT_PATH" -passin env:P12_PASSWORD -nodes -out "$RUNNER_TEMP/cert_temp.pem"
            openssl pkcs12 -export -legacy -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
              -in "$RUNNER_TEMP/cert_temp.pem" -passout env:P12_PASSWORD -out "$RUNNER_TEMP/cert_legacy.p12"
            rm -f "$RUNNER_TEMP/cert_temp.pem"
            security import "$RUNNER_TEMP/cert_legacy.p12" -P "$(cat "$P12_PASS_FILE")" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm -f "$RUNNER_TEMP/cert_legacy.p12"
            echo "Apple Distribution certificate imported successfully via legacy compatibility conversion."
          fi

          # Authorize code signing tool access to keychain partition
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$(cat "$KC_PASS_FILE")" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Explicitly delete password files right after keychain setup
          cleanup_passwords

          # Decode provisioning profile to temporary plist file and parse via PlistBuddy
          security cms -D -i "$PP_PATH" > "$PROV_PLIST"
          if [ ! -s "$PROV_PLIST" ]; then
            echo "::error::Failed to decode provisioning profile via security cms."
            exit 1
          fi

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROV_PLIST" 2>/dev/null || true)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROV_PLIST" 2>/dev/null || true)
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROV_PLIST" 2>/dev/null || true)
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROV_PLIST" 2>/dev/null || true)

          if [ -z "$PROFILE_UUID" ] || [ -z "$PROFILE_NAME" ] || [ -z "$PROFILE_TEAM" ]; then
            echo "::error::Could not extract required metadata (UUID, Name, Team ID) from provisioning profile."
            exit 1
          fi

          # Validate Team ID if provided via secret
          if [ -n "${INPUT_TEAM_ID:-}" ] && [ "$INPUT_TEAM_ID" != "$PROFILE_TEAM" ]; then
            echo "::error::Provisioning Profile Team ID ($PROFILE_TEAM) does not match expected secret APPLE_TEAM_ID ($INPUT_TEAM_ID)."
            exit 1
          fi

          # Validate Bundle ID (application-identifier matches <TeamID>.com.junald69.clipharbor or com.junald69.clipharbor)
          EXPECTED_BUNDLE_ID="com.junald69.clipharbor"
          EXPECTED_APP_ID_PREFIX="${PROFILE_TEAM}.${EXPECTED_BUNDLE_ID}"

          if [ "$PROFILE_APP_ID" != "$EXPECTED_APP_ID_PREFIX" ] && [ "$PROFILE_APP_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error::Provisioning Profile application-identifier ($PROFILE_APP_ID) does not match expected Bundle ID ($EXPECTED_BUNDLE_ID)."
            exit 1
          fi

          echo "Provisioning Profile validated successfully:"
          echo "  Profile Name : $PROFILE_NAME"
          echo "  Profile UUID : $PROFILE_UUID"
          echo "  Team ID      : $PROFILE_TEAM"
          echo "  App ID       : $PROFILE_APP_ID"

          # Install provisioning profile to exact user path
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          INSTALLED_PROFILE_PATH="$PROFILES_DIR/${PROFILE_UUID}.mobileprovision"
          cp "$PP_PATH" "$INSTALLED_PROFILE_PATH"
          chmod 600 "$INSTALLED_PROFILE_PATH"

          # Export required variables to environment for subsequent steps
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "DETECTED_TEAM_ID=$PROFILE_TEAM" >> "$GITHUB_ENV"
          echo "INSTALLED_PROFILE_PATH=$INSTALLED_PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Build Release Archive
        shell: bash
        env:
          INPUT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          TEAM_ID="${INPUT_TEAM_ID:-$DETECTED_TEAM_ID}"
          ARCHIVE_PATH="$RUNNER_TEMP/ClipHarbor.xcarchive"

          echo "Archiving ClipHarbor with Team ID: $TEAM_ID, Profile UUID: $PROFILE_UUID"
          xcodebuild archive \
            -project ClipHarbor.xcodeproj \
            -scheme ClipHarbor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            APP_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

          test -d "$ARCHIVE_PATH"
          echo "Release archive created successfully at $ARCHIVE_PATH"

      - name: Export signed App Store IPA
        shell: bash
        env:
          INPUT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          TEAM_ID="${INPUT_TEAM_ID:-$DETECTED_TEAM_ID}"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_DIR="$RUNNER_TEMP/Export"
          mkdir -p "$EXPORT_DIR"

          # Prefer modern 'app-store-connect' method, fall back to legacy 'app-store' if needed
          cat <<EOF > "$EXPORT_OPTIONS"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.junald69.clipharbor</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "Attempting IPA export using preferred method 'app-store-connect'..."
          if ! xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ClipHarbor.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT_DIR"; then
            echo "Export with 'app-store-connect' failed. Falling back to legacy method 'app-store'..."
            sed -i '' 's|<string>app-store-connect</string>|<string>app-store</string>|g' "$EXPORT_OPTIONS"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/ClipHarbor.xcarchive" \
              -exportOptionsPlist "$EXPORT_OPTIONS" \
              -exportPath "$EXPORT_DIR"
          fi

          IPA_PATH="$EXPORT_DIR/ClipHarbor.ipa"
          test -f "$IPA_PATH"
          echo "Signed IPA exported successfully: $(ls -lh "$IPA_PATH")"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Validate exported package metadata and signatures
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Inspecting embedded Info.plist in signed IPA ==="
          unzip -q -c "$IPA_PATH" "Payload/ClipHarbor.app/Info.plist" > "$RUNNER_TEMP/Payload_Info.plist"
          plutil -p "$RUNNER_TEMP/Payload_Info.plist"

          python3 - "$RUNNER_TEMP/Payload_Info.plist" << 'EOF'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              info = plistlib.load(f)
          assert info.get("CFBundleIdentifier") == "com.junald69.clipharbor", f"Unexpected Bundle ID: {info.get('CFBundleIdentifier')}"
          assert info.get("CFBundleShortVersionString") == "1.0.0", f"Unexpected Version: {info.get('CFBundleShortVersionString')}"
          assert info.get("CFBundleVersion") == "1", f"Unexpected Build: {info.get('CFBundleVersion')}"
          assert info.get("UIFileSharingEnabled") is True, "UIFileSharingEnabled must be True"
          assert info.get("LSSupportsOpeningDocumentsInPlace") is True, "LSSupportsOpeningDocumentsInPlace must be True"
          print("Signed IPA metadata validated successfully.")
          EOF

          echo "=== Verifying PrivacyInfo.xcprivacy in signed IPA ==="
          unzip -l "$IPA_PATH" | grep -F "PrivacyInfo.xcprivacy"

      - name: Setup App Store Connect API Key
        shell: bash
        env:
          APPSTORE_API_KEY_INPUT: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPSTORE_API_KEY_INPUT" ] || [ -z "$APPSTORE_KEY_ID" ] || [ -z "$APPSTORE_ISSUER_ID" ]; then
            echo "::error::App Store Connect API Key secrets are missing or incomplete."
            exit 1
          fi

          # Place API key strictly inside RUNNER_TEMP/private_keys (never in repository workspace)
          API_KEYS_TEMP_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$API_KEYS_TEMP_DIR" "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$API_KEYS_TEMP_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"

          if [[ "$APPSTORE_API_KEY_INPUT" == *"BEGIN PRIVATE KEY"* ]]; then
            echo "$APPSTORE_API_KEY_INPUT" > "$KEY_FILE"
          else
            echo "$APPSTORE_API_KEY_INPUT" | tr -d '\r\n ' | base64 --decode > "$KEY_FILE"
          fi

          chmod 600 "$KEY_FILE"
          cp "$KEY_FILE" "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

          echo "API_PRIVATE_KEYS_DIR=$API_KEYS_TEMP_DIR" >> "$GITHUB_ENV"
          echo "APPSTORE_KEY_ID=$APPSTORE_KEY_ID" >> "$GITHUB_ENV"
          echo "App Store Connect API key registered securely for Key ID: $APPSTORE_KEY_ID"

      - name: Pre-upload validation with App Store Connect
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "Validating IPA with App Store Connect (--validate-app)..."
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
          echo "App Store Connect pre-upload validation passed successfully."
          echo "Note: Validation verifies bundle structure, entitlements, and metadata against App Store Connect requirements."

      - name: Upload to App Store Connect (TestFlight)
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry run is active. Skipping upload to App Store Connect."
            exit 0
          fi

          echo "Uploading IPA to TestFlight via App Store Connect (--upload-app)..."
          UPLOAD_OUTPUT=$(xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" 2>&1)
          
          echo "$UPLOAD_OUTPUT"
          
          if echo "$UPLOAD_OUTPUT" | grep -iq "No errors uploading"; then
            echo "Upload to TestFlight finished successfully!"
            echo "UPLOAD_COMPLETED=true" >> "$GITHUB_ENV"
          else
            echo "::error::Upload to TestFlight did not confirm successful receipt."
            exit 1
          fi

      - name: Report deployment outcome
        if: success()
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          UPLOAD_COMPLETED: ${{ env.UPLOAD_COMPLETED || 'false' }}
        run: |
          if [ "${DRY_RUN:-false}" = "true" ]; then
            cat <<'EOF'
          ======================================================================
          ClipHarbor TestFlight Deployment - DRY RUN COMPLETED
          ======================================================================
          Mode              : Dry Run (No package uploaded to App Store Connect)
          Bundle Identifier : com.junald69.clipharbor
          Version           : 1.0.0
          Build             : 1

          Verification Results:
          * 139 XCTest unit tests: PASS
          * Apple Distribution certificate & profile validation: PASS
          * Release archive creation & manual code sign: PASS
          * Info.plist metadata (Bundle ID / Version / File Sharing): PASS
          * PrivacyInfo.xcprivacy bundle inclusion: PASS
          * App Store Connect API pre-upload validation (--validate-app): PASS

          [Notice]
          * In Dry Run mode, no binary was uploaded to App Store Connect.
          * Passing validation confirms bundle structure and entitlements meet App Store Connect criteria.
          * It does not guarantee approval in App Store Review.
          ======================================================================
          EOF
          else
            cat <<'EOF'
          ======================================================================
          ClipHarbor TestFlight Deployment - UPLOAD COMPLETED
          ======================================================================
          Mode              : Production Upload to TestFlight
          Bundle Identifier : com.junald69.clipharbor
          Version           : 1.0.0
          Build             : 1

          Status:
          * IPA binary successfully uploaded to App Store Connect.
          * Currently in "Processing" state on Apple servers (typically 5-15 min).
          * Automated symbol verification and encryption compliance checks are underway.

          [Notice]
          * TestFlight ingestion does not constitute App Store Review approval.
          * Internal testing is available after processing completes.
          * External testing and App Store distribution require review submission.

          Dashboard:
          * https://appstoreconnect.apple.com/apps/com.junald69.clipharbor/testflight/ios

          Next Steps in App Store Connect:
          1. Wait for email: "App Store Connect: Version 1.0 (1) has completed processing".
          2. Complete Export Compliance (select "No" if using standard exemptions).
          3. Add Internal Testing group to test on devices.
          ======================================================================
          EOF
          fi

      - name: Report deployment failure
        if: failure()
        shell: bash
        run: |
          cat <<'EOF'
          ======================================================================
          ClipHarbor TestFlight Deployment - FAILED
          ======================================================================
          An error occurred during workflow execution.
          No binary was uploaded or upload was aborted.

          Troubleshooting:
          1. Review failed step logs.
          2. For code signing issues, check BUILD_CERTIFICATE_BASE64, P12_PASSWORD, and BUILD_PROVISION_PROFILE_BASE64.
          3. For API issues, check APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, and APPSTORE_API_KEY_BASE64.
          4. Temporary keychain and profile are safely removed by subsequent cleanup step.
          ======================================================================
          EOF

      - name: Clean up temporary keychain and credentials
        if: always()
        shell: bash
        run: |
          echo "=== Removing temporary signing credentials, keychain, and working files ==="
          
          # Delete temporary keychain if it exists (using environment variable or deterministic path)
          DEFAULT_KEYCHAIN="$RUNNER_TEMP/build_signing.keychain-db"
          TARGET_KEYCHAIN="${KEYCHAIN_PATH:-$DEFAULT_KEYCHAIN}"
          if [ -f "$TARGET_KEYCHAIN" ]; then
            echo "Deleting temporary keychain: $TARGET_KEYCHAIN"
            security delete-keychain "$TARGET_KEYCHAIN" 2>/dev/null || true
            rm -f "$TARGET_KEYCHAIN" 2>/dev/null || true
          fi

          # Delete installed provisioning profile by exact path
          if [ -n "${INSTALLED_PROFILE_PATH:-}" ] && [ -f "$INSTALLED_PROFILE_PATH" ]; then
            echo "Deleting installed provisioning profile: $INSTALLED_PROFILE_PATH"
            rm -f "$INSTALLED_PROFILE_PATH" 2>/dev/null || true
          elif [ -n "${PROFILE_UUID:-}" ]; then
            EXACT_PP="$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
            if [ -f "$EXACT_PP" ]; then
              echo "Deleting installed provisioning profile: $EXACT_PP"
              rm -f "$EXACT_PP" 2>/dev/null || true
            fi
          fi

          # Delete all temporary files strictly from RUNNER_TEMP
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.p8 "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*.plist "$RUNNER_TEMP"/*.pem "$RUNNER_TEMP"/.*_pass "$RUNNER_TEMP"/*.keychain* 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" 2>/dev/null || true

          # Delete App Store Connect API keys created in user home
          if [ -n "${APPSTORE_KEY_ID:-}" ]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" 2>/dev/null || true
            rm -f "$HOME/.private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" 2>/dev/null || true
          fi

          echo "Cleanup finished."
