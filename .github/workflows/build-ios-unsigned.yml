name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/vault-data-protection
      - 'feature/**'
    paths:
      - 'ClipHarbor/**'
      - 'ClipHarborTests/**'
      - 'ClipHarbor.xcodeproj/**'
      - '.github/workflows/build-ios-unsigned.yml'
      - 'make_project.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version and SDKs
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project ClipHarbor.xcodeproj

      - name: Run unit tests on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "import json, sys; d=json.load(sys.stdin)['devices']; print([dev['name'] for devs in d.values() for dev in devs if 'iPhone' in dev['name']][0])")
          echo "Using simulator: $SIM_NAME"
          xcodebuild test \
            -project ClipHarbor.xcodeproj \
            -scheme ClipHarbor \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build for generic iOS device without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ClipHarbor.xcodeproj \
            -scheme ClipHarbor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ClipHarbor.app"
          test -d "$APP"
          echo "=== Inspecting generated Info.plist ==="
          plutil -p "$APP/Info.plist"
          python3 - "$APP/Info.plist" << 'EOF'
          import plistlib, sys
          plist_path = sys.argv[1]
          with open(plist_path, "rb") as f:
              info = plistlib.load(f)
          for key in ("UIFileSharingEnabled", "LSSupportsOpeningDocumentsInPlace"):
              val = info.get(key)
              print(f"Verified {key} = {val!r} (type: {type(val).__name__})")
              if val is not True:
                  sys.exit(f"ERROR: {key} must be Boolean True in Info.plist, got {val!r}")
          if "UILaunchScreen" not in info:
              sys.exit("ERROR: UILaunchScreen is missing from Info.plist")
          expected_values = {
              "CFBundleIdentifier": "com.junald69.clipharbor",
              "CFBundleShortVersionString": "1.0.0",
              "CFBundleVersion": "1",
          }
          for key, expected in expected_values.items():
              val = info.get(key)
              print(f"Verified {key} = {val!r}")
              if val != expected:
                  sys.exit(f"ERROR: {key} expected {expected!r}, got {val!r}")
          print("Info.plist verification passed successfully.")
          EOF
          echo "=== Inspecting PrivacyInfo.xcprivacy ==="
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -p "$APP/PrivacyInfo.xcprivacy"
          python3 - "$APP/PrivacyInfo.xcprivacy" << 'EOF'
          import plistlib, sys
          privacy_path = sys.argv[1]
          with open(privacy_path, "rb") as f:
              privacy = plistlib.load(f)
          if privacy.get("NSPrivacyTracking") is not False:
              sys.exit(f"ERROR: NSPrivacyTracking must be False, got {privacy.get('NSPrivacyTracking')!r}")
          if privacy.get("NSPrivacyTrackingDomains") != []:
              sys.exit(f"ERROR: NSPrivacyTrackingDomains must be empty, got {privacy.get('NSPrivacyTrackingDomains')!r}")
          if privacy.get("NSPrivacyCollectedDataTypes") != []:
              sys.exit(f"ERROR: NSPrivacyCollectedDataTypes must be empty, got {privacy.get('NSPrivacyCollectedDataTypes')!r}")
          accessed_types = {item.get("NSPrivacyAccessedAPIType"): item.get("NSPrivacyAccessedAPITypeReasons") for item in privacy.get("NSPrivacyAccessedAPITypes", [])}
          expected_reasons = {
              "NSPrivacyAccessedAPICategoryUserDefaults": ["CA92.1"],
              "NSPrivacyAccessedAPICategoryFileTimestamp": ["C617.1", "DDA9.1"],
              "NSPrivacyAccessedAPICategoryDiskSpace": ["E174.1", "85F4.1"],
              "NSPrivacyAccessedAPICategorySystemBootTime": ["35F9.1"]
          }
          for cat, reasons in expected_reasons.items():
              if cat not in accessed_types:
                  sys.exit(f"ERROR: Missing Required Reason API category {cat} in PrivacyInfo.xcprivacy")
              for r in reasons:
                  if r not in accessed_types[cat]:
                      sys.exit(f"ERROR: Missing reason code {r} in {cat}")
              print(f"Verified {cat} -> {accessed_types[cat]}")
          print("PrivacyInfo.xcprivacy verification passed successfully.")
          EOF
          STAGE="$RUNNER_TEMP/ClipHarborIPA"
          mkdir -p "$STAGE/Payload"
          ditto "$APP" "$STAGE/Payload/ClipHarbor.app"
          cd "$STAGE"
          zip -qry "$GITHUB_WORKSPACE/ClipHarbor-unsigned.ipa" Payload
          unzip -l "$GITHUB_WORKSPACE/ClipHarbor-unsigned.ipa" | head -n 30

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClipHarbor-unsigned-ipa
          path: ClipHarbor-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
