name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'ClipHarbor/**'
  #     - 'ClipHarbor.xcodeproj/**'
  #     - '.github/workflows/build-ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version and SDKs
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project ClipHarbor.xcodeproj

      - name: Build for generic iOS device without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ClipHarbor.xcodeproj \
            -scheme ClipHarbor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ClipHarbor.app"
          test -d "$APP"
          echo "=== Inspecting generated Info.plist ==="
          plutil -p "$APP/Info.plist"
          python3 - "$APP/Info.plist" << 'EOF'
          import plistlib, sys
          plist_path = sys.argv[1]
          with open(plist_path, "rb") as f:
              info = plistlib.load(f)
          for key in ("UIFileSharingEnabled", "LSSupportsOpeningDocumentsInPlace"):
              val = info.get(key)
              print(f"Verified {key} = {val!r} (type: {type(val).__name__})")
              if val is not True:
                  sys.exit(f"ERROR: {key} must be Boolean True in Info.plist, got {val!r}")
          if "UILaunchScreen" not in info:
              sys.exit("ERROR: UILaunchScreen is missing from Info.plist")
          print("Info.plist verification passed successfully.")
          EOF
          STAGE="$RUNNER_TEMP/ClipHarborIPA"
          mkdir -p "$STAGE/Payload"
          ditto "$APP" "$STAGE/Payload/ClipHarbor.app"
          cd "$STAGE"
          zip -qry "$GITHUB_WORKSPACE/ClipHarbor-unsigned.ipa" Payload
          unzip -l "$GITHUB_WORKSPACE/ClipHarbor-unsigned.ipa" | head -n 30

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClipHarbor-unsigned-ipa
          path: ClipHarbor-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
